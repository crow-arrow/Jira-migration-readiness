[project]
name = "jmrt"
version = "0.1.0"
description = "Jira Migration Readiness Tool (DC -> Cloud) - assessment & reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.7.4",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
]

[project.scripts]
jmrt = "jmrt.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
